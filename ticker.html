<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Ticker - BacktestPro</title>
    <meta content="width=device-width, initial-scale=1.0, shrink-to-fit=no" name="viewport" />
    <link rel="icon" href="/static/img/kaiadmin/favicon.ico" type="image/x-icon" />

    <script src="/static/js/plugin/webfont/webfont.min.js"></script>
    <script>
      WebFont.load({
        google: { families: ["Public Sans:300,400,500,600,700"] },
        custom: {
          families: ["Font Awesome 5 Solid", "Font Awesome 5 Regular", "Font Awesome 5 Brands", "simple-line-icons"],
          urls: ["/static/css/fonts.min.css"],
        },
        active: function () { sessionStorage.fonts = true; },
      });
    </script>

    <link rel="stylesheet" href="/static/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/static/css/plugins.min.css" />
    <link rel="stylesheet" href="/static/css/kaiadmin.min.css" />
    <link rel="stylesheet" href="/static/css/fonts.min.css" />
    <link rel="stylesheet" href="/static/css/ticker.css" />
    <style>
      /* 3-panel butterfly layout */
      .bf-panel { flex: 1; min-width: 0; overflow-x: scroll; overflow-y: auto; scrollbar-width: none; }
      .bf-panel::-webkit-scrollbar { display: none; }
      .bf-panel table {
        border-collapse: collapse; min-width: 480px; width: 100%; table-layout: fixed;
      }
      #bfStrikePanel table {
        border-collapse: collapse; width: 96px; table-layout: fixed;
      }
      .bf-panel th, .bf-panel td,
      #bfStrikePanel th, #bfStrikePanel td {
        height: 34px; line-height: 34px; padding: 0 8px;
        font-size: 11px; white-space: nowrap; border-bottom: 1px solid #f0f2f5;
        text-align: center; box-sizing: border-box;
      }
      .bf-panel thead th, #bfStrikePanel thead th {
        font-weight: 700; background: #f8f9fc; height: 36px; line-height: 36px;
        border-bottom: 2px solid #e5e9f0; position: sticky; top: 0; z-index: 3;
      }
      #bfStrikePanel { width: 96px; flex-shrink: 0; overflow-x: hidden; overflow-y: auto;
        background: #eef2ff; border-left: 2px solid #c7d4f8; border-right: 2px solid #c7d4f8; }
      #bfStrikePanel thead th { background: #dde8ff; color: #3b6df0; }
      .bf-atm-row td, .bf-atm-row { background: #3b6df0 !important; color: #fff !important; font-weight: 700; }
      .bf-itm-row td { background: rgba(59,109,240,0.04); }
    </style>
  </head>
  <body>
    <div class="container-fluid" style="max-width:1400px;margin:0 auto;padding:20px;">
      <div class="mb-3">
        <a href="/" class="btn btn-outline-secondary btn-sm">
          <i class="fas fa-arrow-left me-1"></i> Dashboard
        </a>
      </div>
      <div>
          <!-- Ticker Header Info Bar -->
          <div id="tickerHeaderInfo" class="d-flex align-items-center justify-content-center gap-3 mb-3 flex-wrap" style="min-height:40px;">
            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
          </div>
          <!-- Ticker Stats Card -->
          <div class="row mb-3">
            <div class="col-12">
              <div class="card" id="tickerInfoCard">
                <div class="card-body py-3">
                  <div id="tickerInfoGrid" class="ticker-info-grid">
                    <div class="text-center py-3"><div class="spinner-border spinner-border-sm text-primary" role="status"></div></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Chart -->
          <div class="row mb-3">
            <div class="col-12">
              <div class="card">
                <div class="card-header py-2 d-flex justify-content-between align-items-center chart-header-mobile">
                  <div class="card-title mb-0" style="font-size:14px;white-space:nowrap;"><i class="fas fa-chart-line text-primary me-2"></i>Price Chart</div>
                  <div class="btn-group btn-group-sm" id="chartPeriodBtns">
                    <button class="btn btn-outline-primary" data-period="1d">1D</button>
                    <button class="btn btn-outline-primary" data-period="5d">5D</button>
                    <button class="btn btn-outline-primary" data-period="1mo">1M</button>
                    <button class="btn btn-outline-primary active" data-period="3mo">3M</button>
                    <button class="btn btn-outline-primary" data-period="6mo">6M</button>
                    <button class="btn btn-outline-primary" data-period="1y">1Y</button>
                    <button class="btn btn-outline-primary" data-period="5y">5Y</button>
                  </div>
                </div>
                <div class="card-body" style="padding:12px;">
                  <div id="chartContainer" style="position:relative;height:400px;">
                    <canvas id="priceChart"></canvas>
                    <div id="chartLoading" class="chart-loading">
                      <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- News + Financials -->
          <div class="row mb-3">
            <div class="col-lg-5">
              <div class="card" style="height:100%;">
                <div class="card-header py-2">
                  <div class="card-title mb-0" style="font-size:14px;"><i class="fas fa-newspaper text-primary me-2"></i>News</div>
                </div>
                <div class="card-body py-2" style="max-height:500px;overflow-y:auto;">
                  <div id="tickerNewsContainer">
                    <div class="text-center py-3"><div class="spinner-border spinner-border-sm text-primary" role="status"></div></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-lg-7">
              <div class="card" style="height:100%;">
                <div class="card-header py-2 d-flex justify-content-between align-items-center">
                  <div class="card-title mb-0" style="font-size:14px;"><i class="fas fa-chart-bar text-success me-2"></i>Financials</div>
                  <div class="btn-group btn-group-sm" id="financialTabBtns">
                    <button class="btn btn-outline-primary active" data-tab="income">Income</button>
                    <button class="btn btn-outline-primary" data-tab="balance">Balance Sheet</button>
                    <button class="btn btn-outline-primary" data-tab="cashflow">Cash Flow</button>
                  </div>
                </div>
                <div class="card-body py-2" style="overflow-x:auto;">
                  <div id="financialsContainer">
                    <div class="text-center py-3"><div class="spinner-border spinner-border-sm text-primary" role="status"></div></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Financial Trend Chart -->
          <div class="row mb-3">
            <div class="col-12">
              <div class="card" id="financialChartCard" style="display:none;">
                <div class="card-header py-2 d-flex justify-content-between align-items-center">
                  <div class="card-title mb-0" style="font-size:14px;">
                    <i class="fas fa-chart-area text-success me-2"></i>
                    <span id="financialChartLabel">Financial Trend</span>
                  </div>
                  <button class="btn btn-sm btn-outline-secondary" id="closeFinancialChart" title="Close chart">
                    <i class="fas fa-times"></i>
                  </button>
                </div>
                <div class="card-body" style="padding:12px;">
                  <div id="financialChartContainer" style="position:relative;height:320px;">
                    <canvas id="financialTrendChart"></canvas>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Options Chain -->
          <div class="row mb-3">
            <div class="col-12">
              <div class="card">
                <div class="card-header py-2 d-flex justify-content-between align-items-center flex-wrap gap-2">
                  <div class="card-title mb-0" style="font-size:14px;"><i class="fas fa-layer-group text-primary me-2"></i>Options Chain</div>
                  <div class="d-flex align-items-center gap-2 flex-wrap">
                    <select id="optionsExpiry" class="form-select form-select-sm" style="width:160px;font-size:12px;">
                      <option value="">Loading expirations…</option>
                    </select>
                    <div class="btn-group btn-group-sm" id="optionsTypeBtns">
                      <button class="btn btn-outline-success active" data-opt-type="calls">Calls</button>
                      <button class="btn btn-outline-danger" data-opt-type="puts">Puts</button>
                      <button class="btn btn-outline-primary" data-opt-type="both">Both</button>
                    </div>
                  </div>
                </div>
                <div class="card-body py-2">
                  <!-- Volume chart -->
                  <div id="optionsChartWrap" style="position:relative;height:260px;margin-bottom:4px;">
                    <canvas id="optionsVolumeChart"></canvas>
                    <div id="optionsChartMsg" class="text-center py-5 text-muted" style="font-size:13px;display:none;">No data</div>
                  </div>

                  <!-- Collapsible butterfly chain -->
                  <div style="border-top:1px solid #f0f2f5;margin-top:8px;padding-top:6px;">
                    <button id="toggleChainBtn" class="btn btn-sm btn-outline-secondary w-100 d-flex align-items-center justify-content-between" style="font-size:12px;">
                      <span><i class="fas fa-table me-1"></i>Options Chain Table</span>
                      <i class="fas fa-chevron-down" id="toggleChainIcon"></i>
                    </button>
                    <div id="optionsChainCollapse" style="display:none;margin-top:8px;">
                      <!-- 3-panel butterfly layout: Calls | Strike (fixed center) | Puts -->
                      <div style="display:flex;max-height:400px;border:1px solid #e5e9f0;border-radius:6px;overflow:hidden;" id="bfWrapper">
                        <div class="bf-panel" id="bfCallsPanel">
                          <div id="bfCallsWrap" style="min-width:480px;">
                            <div class="text-center py-4">
                              <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                              <span class="ms-2 text-muted" style="font-size:13px;">Loading…</span>
                            </div>
                          </div>
                        </div>
                        <div id="bfStrikePanel">
                          <div id="bfStrikeWrap" style="width:96px;"></div>
                        </div>
                        <div class="bf-panel" id="bfPutsPanel">
                          <div id="bfPutsWrap" style="min-width:480px;"></div>
                        </div>
                      </div>
                      <div style="padding:4px 4px 0;">
                        <input type="range" id="butterflyScrollBar" min="0" max="100" value="0" style="width:100%;height:4px;accent-color:#3b6df0;">
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/static/js/core/jquery-3.7.1.min.js"></script>
    <script src="/static/js/core/popper.min.js"></script>
    <script src="/static/js/core/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
    <script src="/static/js/ticker-script.js"></script>
  </body>
</html>
